name: Creative production workflow tests

on:
  push:
    paths:
      - "projects/ai-assisted-production-workflow/**"
      - "projects/entertainment-supercut/**"
      - "projects/campaign-motion-static/**"
      - ".github/workflows/creative-workflow-tests.yml"
  pull_request:
    paths:
      - "projects/ai-assisted-production-workflow/**"
      - "projects/entertainment-supercut/**"
      - "projects/campaign-motion-static/**"
      - ".github/workflows/creative-workflow-tests.yml"

jobs:
  validate-manifest-and-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-assisted-production-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production manifest
        run: python validate_manifest.py
      - name: Run Python unit tests
        run: python -m unittest -v
      - name: Check render scripts and required creative assets
        working-directory: .
        run: |
          bash -n projects/entertainment-supercut/render_teaser.sh
          bash -n projects/campaign-motion-static/render_campaign_card.sh
          test -s projects/entertainment-supercut/index.html
          test -s projects/entertainment-supercut/production-notes.md
          test -s projects/campaign-motion-static/poster-vertical.svg
          test -s projects/campaign-motion-static/poster-square.svg
          test -s projects/campaign-motion-static/poster-landscape.svg
          test -s projects/campaign-motion-static/motion-title-card.html
