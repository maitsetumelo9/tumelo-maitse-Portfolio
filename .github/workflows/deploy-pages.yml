name: Deploy 0xDev portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 0xdev-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure media rendering tools are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Render teaser MP4
        run: |
          bash projects/entertainment-supercut/render_teaser.sh projects/entertainment-supercut/after-the-signal-teaser.mp4
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 projects/entertainment-supercut/after-the-signal-teaser.mp4 | cut -d. -f1)" = "12"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 projects/entertainment-supercut/after-the-signal-teaser.mp4)" = "720x1280"

      - name: Render campaign motion card MP4
        run: |
          bash projects/campaign-motion-static/render_campaign_card.sh projects/campaign-motion-static/campaign-motion-card.mp4
          test "$(ffprobe -v error -show_entries format=duration -of csv=p=0 projects/campaign-motion-static/campaign-motion-card.mp4 | cut -d. -f1)" = "6"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 projects/campaign-motion-static/campaign-motion-card.mp4)" = "1920x1080"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site and generated media
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
