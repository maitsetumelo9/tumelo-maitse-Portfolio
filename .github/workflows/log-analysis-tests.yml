name: Security Lab Tests

on:
  push:
    branches: [main]
    paths:
      - "projects/log-analysis-dashboard/**"
      - "projects/soc-analyst-investigation-lab/**"
      - "projects/threat-intelligence-ioc-analyzer/**"
      - "projects/web-security-practice-lab/**"
      - "projects/secure-job-tracker/**"
      - ".github/workflows/log-analysis-tests.yml"
  pull_request:
    paths:
      - "projects/log-analysis-dashboard/**"
      - "projects/soc-analyst-investigation-lab/**"
      - "projects/threat-intelligence-ioc-analyzer/**"
      - "projects/web-security-practice-lab/**"
      - "projects/secure-job-tracker/**"
      - ".github/workflows/log-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run log analysis unit tests
        run: node projects/log-analysis-dashboard/test.js
      - name: Run SOC investigation lab tests
        run: node projects/soc-analyst-investigation-lab/test.js
      - name: Run IOC analyzer tests
        run: node projects/threat-intelligence-ioc-analyzer/test.js
      - name: Run web security practice lab tests
        run: node projects/web-security-practice-lab/test.js
      - name: Run JobTrack validation and CSV safety tests
        run: node projects/secure-job-tracker/test.js
