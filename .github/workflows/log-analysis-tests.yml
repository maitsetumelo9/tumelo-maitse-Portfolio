name: Security Lab Tests

on:
  push:
    branches: [main]
    paths:
      - "projects/log-analysis-dashboard/**"
      - "projects/soc-analyst-investigation-lab/**"
      - ".github/workflows/log-analysis-tests.yml"
  pull_request:
    paths:
      - "projects/log-analysis-dashboard/**"
      - "projects/soc-analyst-investigation-lab/**"
      - ".github/workflows/log-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run log analysis unit tests
        run: node projects/log-analysis-dashboard/test.js
      - name: Run SOC investigation lab tests
        run: node projects/soc-analyst-investigation-lab/test.js
