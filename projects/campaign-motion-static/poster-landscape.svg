<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">AFTER THE SIGNAL</title><desc id="desc">Original fictional science fiction campaign poster. The future called. Nobody should answer.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1c2b"/><stop offset=".56" stop-color="#101323"/><stop offset="1" stop-color="#211a2b"/></linearGradient><radialGradient id="glow"><stop stop-color="#1c6270" stop-opacity=".9"/><stop offset="1" stop-color="#102a3c" stop-opacity="0"/></radialGradient></defs><rect width="1920" height="1080" fill="#080b15"/><rect x="20" y="20" width="1880" height="1040" rx="4" fill="url(#bg)" stroke="#31526a" stroke-width="2"/><circle cx="1402" cy="464" r="259" fill="url(#glow)"/><circle cx="1402" cy="464" r="184" fill="none" stroke="#75f2ef" stroke-opacity=".7" stroke-width="2"/><circle cx="1402" cy="464" r="227" fill="none" stroke="#75f2ef" stroke-opacity=".16" stroke-width="2"/><text x="173" y="130" fill="#ffbf69" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">TRANSMISSION 001 / UNKNOWN ORIGIN</text><text x="154" y="529" fill="#f4f6ff" font-family="Arial,sans-serif" font-weight="900" font-size="104" letter-spacing="-5">AFTER THE</text><text x="154" y="625" fill="#75f2ef" font-family="Arial,sans-serif" font-weight="900" font-size="104" letter-spacing="-5">SIGNAL</text><text x="173" y="778" fill="#b4bfd6" font-family="Arial,sans-serif" font-size="42">The future called.</text><text x="173" y="841" fill="#b4bfd6" font-family="Arial,sans-serif" font-size="42">Nobody should answer.</text><path d="M 173 929 H 1747" stroke="#f4f6ff" stroke-opacity=".35"/><text x="173" y="972" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">A FICTIONAL MYSTERY CONCEPT</text></svg>