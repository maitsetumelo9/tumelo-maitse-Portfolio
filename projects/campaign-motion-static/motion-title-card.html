<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTER THE SIGNAL — 6s Motion Card</title><style>:root{color-scheme:dark;--cyan:#75f2ef;--amber:#ffbf69}*{box-sizing:border-box}body{margin:0;background:#080b15;color:#f4f6ff;font:16px/1.4 Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:24px auto}.stage{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(145deg,#0d1c2b,#101323 55%,#211a2b);border:1px solid #31526a;display:grid;place-items:center}.orb{position:absolute;width:32%;aspect-ratio:1;border:1px solid #75f2ef99;border-radius:50%;box-shadow:0 0 0 24px #75f2ef0b,0 0 0 55px #75f2ef08;animation:orb 6s ease-in-out infinite}.kicker{position:absolute;top:10%;left:8%;letter-spacing:.18em;color:var(--amber);font-size:clamp(.55rem,1vw,.8rem);animation:fade 6s linear infinite}.title{position:relative;text-align:center;font-size:clamp(2rem,9vw,7rem);font-weight:900;letter-spacing:-.07em;line-height:.8;margin:0;animation:title 6s ease-in-out infinite}.title span{display:block;color:var(--cyan)}.tagline{position:absolute;bottom:10%;font-size:clamp(.6rem,1.5vw,1rem);color:#b4bfd6;letter-spacing:.05em;animation:fade 6s linear infinite}.controls{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0;color:#b4bfd6;font-size:.85rem}button{font:inherit;color:#f4f6ff;background:#11182a;border:1px solid #33445c;border-radius:6px;padding:8px 12px;cursor:pointer}@keyframes orb{0%,100%{transform:scale(.8);opacity:.4}50%{transform:scale(1.2);opacity:1}}@keyframes title{0%,10%{opacity:0;transform:translateY(18px);filter:blur(8px)}25%,80%{opacity:1;transform:translateY(0);filter:blur(0)}100%{opacity:0;transform:translateY(-10px)}}@keyframes fade{0%,15%{opacity:0}30%,75%{opacity:1}100%{opacity:0}}.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.title,.kicker,.tagline{opacity:1}}</style></head><body><main class="wrap"><div class="stage" id="stage"><div class="orb"></div><div class="kicker">TRANSMISSION 001 / UNKNOWN ORIGIN</div><h1 class="title">AFTER THE <span>SIGNAL</span></h1><div class="tagline">THE FUTURE CALLED. NOBODY SHOULD ANSWER.</div></div><div class="controls"><span>6-second looping motion study · 16:9</span><button id="pause" type="button" aria-pressed="false">Pause preview</button></div><p>Original browser-based motion title card. No external assets or sound. This is an animation preview, not an exported video file.</p></main><script>const s=document.getElementById('stage'),b=document.getElementById('pause');b.addEventListener('click',()=>{const paused=b.getAttribute('aria-pressed')!=='true';s.classList.toggle('paused',paused);b.setAttribute('aria-pressed',String(paused));b.textContent=paused?'Resume preview':'Pause preview';});</script></body></html>
