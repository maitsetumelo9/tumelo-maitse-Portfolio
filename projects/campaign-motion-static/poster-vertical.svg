<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc"><title id="title">AFTER THE SIGNAL</title><desc id="desc">Original fictional science fiction campaign poster. The future called. Nobody should answer.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1c2b"/><stop offset=".56" stop-color="#101323"/><stop offset="1" stop-color="#211a2b"/></linearGradient><radialGradient id="glow"><stop stop-color="#1c6270" stop-opacity=".9"/><stop offset="1" stop-color="#102a3c" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1920" fill="#080b15"/><rect x="20" y="20" width="1040" height="1880" rx="4" fill="url(#bg)" stroke="#31526a" stroke-width="2"/><circle cx="788" cy="826" r="259" fill="url(#glow)"/><circle cx="788" cy="826" r="184" fill="none" stroke="#75f2ef" stroke-opacity=".7" stroke-width="2"/><circle cx="788" cy="826" r="227" fill="none" stroke="#75f2ef" stroke-opacity=".16" stroke-width="2"/><text x="97" y="230" fill="#ffbf69" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">TRANSMISSION 001 / UNKNOWN ORIGIN</text><text x="86" y="941" fill="#f4f6ff" font-family="Arial,sans-serif" font-weight="900" font-size="102" letter-spacing="-5">AFTER THE</text><text x="86" y="1035" fill="#75f2ef" font-family="Arial,sans-serif" font-weight="900" font-size="102" letter-spacing="-5">SIGNAL</text><text x="97" y="1382" fill="#b4bfd6" font-family="Arial,sans-serif" font-size="43">The future called.</text><text x="97" y="1447" fill="#b4bfd6" font-family="Arial,sans-serif" font-size="43">Nobody should answer.</text><path d="M 97 1651 H 983" stroke="#f4f6ff" stroke-opacity=".35"/><text x="97" y="1728" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">A FICTIONAL MYSTERY CONCEPT</text></svg>